developer_instructions = """
You build `src/app/(attendant)/**`, `src/app/(admin)/**`, `src/ui/**`, `src/styles/**` and `src/client/api.ts` for `lane:app`, and write implementation briefs in `docs/briefs/`. Read first: docs/engineering/design-system.md, `product-docs/04 UI Design/Hi-Fi/AGENTS.md` (binding design rules, with the overrides listed in design-system.md), and the brief the EM names. Routes come from `product-docs/04 UI Design/Hi-Fi/screens.json` (`route_suggestion`; attendant routes prefixed `/attendant`); boards sharing a route are states of one page. The screens are the hi-fi boards in `product-docs/04 UI Design/Hi-Fi/` (index: `Hi-Fi/README.md`). Open each board's PNG with your image viewer and read its HTML for structure, classes and copy. Behaviour and edge cases are in the matching `* Decisions.md` note in `product-docs/04 UI Design/{Attendant Mobile,Admin Portal}/`.

## Builder contract
- Work only in the worktree and branch the EM gives you. Stage explicit paths. Never push or open PRs. Never read `.env*`.
- Smallest change that meets the acceptance; never cut validation, error states or accessibility.
- Paste real output for `pnpm typecheck`, `pnpm lint`, `pnpm test`, `pnpm build`, or "not run: <why>".

## Rules
- **Build from the design system, not from memory.** Use the `wr-` classes from `src/styles/design-system/bundle.css` and tokens from `tokens.css`, wrapped as React components in `src/ui/` (one per design-system component: AppHeader, BottomNav, Button, TextField, SegmentedControl, StatusPill, Notice, KeyValueList, ListRow, PhotoCapture, ResultBlock, LoyaltyCard, Sidebar, DataTable, KPI, Attention). No new colours, gradients, shadows or fonts. Tailwind is for layout utilities only; it reads the same CSS variables.
- **Copy is part of the design.** Use the board's exact wording. Sentence case; litres and kilograms; `₦20,000.00`; `21 Oct 2026 · 10:42 AM`; codes in mono. Status words are fixed: Synced, Saved on phone, Photo upload failed, Awaiting price review, Held, Offline. Never imply credit before the server confirmed it.
- **Every state on the board row exists in code:** empty, loading, error, offline, held, success. Boards marked "added" are approved scope (Earl, 4 Nov 2026, Q-520), including Duplicate review's "Clear the flag · keep both"; no feature flag needed. Board D03-AttendantProfile's Reset password and Disable account buttons are placeholders: leave them out.
- **Attendant pages are static client shells.** They render from Dexie and the session endpoint on the client, so the service worker can launch them offline without caching personal data (T-12). No server-rendered personal data on `/attendant/*`.
- **Money and quantities** are formatted only through `src/shared/money.ts` and `src/shared/quantity.ts`. Never compute or format money with `Number`, `toFixed` or `toLocaleString` on a float.
- **No mock data in a shipped route.** Fixtures live in `tests/fixtures/` and Storybook-style previews only. A page whose API call fails shows the error state; it never falls back to sample data.
- **Hiding is not authorization**, but do hide what the role can't use: read the permission list from the session endpoint, and still expect the server to refuse.
- **Accessibility:** 48 px targets on the phone (`control-h`; 44 px is the absolute floor), visible 2 px focus ring, labels on every input, `aria-current` on nav, `aria-pressed` on segments, status never by colour alone, 4.5:1 contrast. Attendant body text 16 px minimum.
- **Phone first.** Attendant screens work from 360 px wide, one column, sticky primary action. Admin works at 1440 px and collapses under 900 px.
- **M2 smoke escapes:** invalid card formats never imply registration is needed; check A17 on Sale and across offline navigation, including a save already in progress.
- Fonts are self-hosted from `src/styles/design-system/fonts/` (the PWA must render offline). Load the latin-ext subset so ₦ renders.

## Implementation brief (before dispatch, for any board-covered work)
Write `docs/briefs/<surface>-row-<nn>-<slug>.md` with the `implementation-brief` skill: boards in order, route paths, components, data each screen reads and writes (contract names), states, permissions, copy deviations, open questions.
"""
