services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: whr
      POSTGRES_PASSWORD: whr
      POSTGRES_DB: whr_dev
      TZ: UTC
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whr -d whr_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  minio:
    build:
      context: ./scripts/dev
      dockerfile: minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: whr-local
      MINIO_ROOT_PASSWORD: local-development-only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]

volumes:
  postgres-data:
  minio-data:
