# Review routing for Whales Rewards. High tier: changes need Earl's go (they change the gate itself).
#
#   tier <low|medium|high|docs> <glob> <why...>     first matching tier rule wins for a file
#   domain <reviewer> <glob> <why...>               every match adds that reviewer at medium tier
#   signal <tier-floor> <reviewer|-> <ERE> <why...> an ADDED line matching ERE raises the file to at least
#                                                   that tier and adds the reviewer (- for none)
#
# Globs use shell case matching: * also matches "/". Files no tier rule matches are medium.
# Signal patterns are matched case-insensitively.

# --- Enforcement and agent-loaded files ---------------------------------------------------
tier high AGENTS.md                         agent instructions
tier high */AGENTS.md                       nested agent instructions
tier high .codex/*                          Codex config, agents, hooks
tier high .agents/*                         Codex skills
tier high scripts/review/*                  the review gate
tier high .github/*                         CI and PR checks
tier high docs/agentic/soul.md              principles and authority
tier high .review/README.md                 evidence format
tier docs docs/agentic/lanes/*              lane status files (rewritten every session)
tier high docs/agentic/*                    operating model, work orders, review rules
# Contracts and the data model define security and integrity rules implemented by code.
tier high docs/engineering/contracts/*     endpoint and protocol contracts
tier high docs/engineering/data-model.md   database integrity and authorization model
tier high docs/engineering/invariants.md    the rules reviewers enforce
tier medium docs/engineering/decisions/*    settled decisions (supersede, never rewrite)
tier high .do/*                             App Platform specs (production config)
tier high src/server/adapters/storage*      presigned URLs, bucket access

# --- Access ---------------------------------------------------------------------------------
tier high src/server/modules/auth/*         sign-in, sessions, passwords, tokens
tier high src/server/modules/access/*       roles, permissions, delegation, last Owner
tier high src/server/lib/authz*             authorization helpers
tier high src/app/api/auth/*                auth endpoints
tier high src/server/auth*                  auth configuration

# --- The credit path -----------------------------------------------------------------------
tier high src/server/modules/purchases/*    acceptance, credit, idempotency
tier high src/server/modules/sync/*         sync and finalize
tier high src/app/api/sync/*                sync and finalize endpoints
tier high src/server/modules/evidence/*     photo validation, signed URLs, final path
tier high src/server/modules/corrections/*  revisions, midnight cutoff
tier high src/server/modules/reviews/*      price, card, date, duplicate holds and resolutions
tier high src/server/modules/recovery/*     stranded queue recovery
tier high src/server/modules/giveaway/*     finalization snapshots and revisions
tier high src/server/modules/retention/*    evidence deletion
tier high src/shared/money*                 exact money arithmetic
tier high src/shared/quantity*              exact quantity arithmetic
tier high src/server/lib/time*              trusted time, Africa/Lagos midnight
tier high src/client/offline/*              outbox, IndexedDB, 24-hour window, account partitions
tier high src/client/sw/*                   service worker and caching
tier high jobs/*                            scheduled maintenance

# --- Medium ---------------------------------------------------------------------------------
tier medium prisma/migrations/*             migration (destructive SQL raises it, see signals)
tier medium prisma/*                        schema and seeds
tier medium src/shared/*                    lane contracts
tier medium src/server/*                    domain services
tier medium src/app/api/*                   endpoints
tier medium src/client/*                    client data access
tier medium src/app/*                       pages (wired to the API)

# --- Low and docs ---------------------------------------------------------------------------
tier low src/ui/*                           presentational components
tier low src/styles/*                       styles and vendored design system
tier low public/*                           static assets
tier low tests/*                            tests only
tier low *.test.ts                          tests only
tier low *.test.tsx                         tests only
tier low *.spec.ts                          tests only
tier docs docs/*                            documentation
tier docs *.md                              documentation

# --- Domain reviewers at medium -------------------------------------------------------------
domain integrity-reviewer src/server/modules/leaderboards/*   ranking and ties
domain integrity-reviewer src/server/modules/reports/*        totals and units
domain integrity-reviewer src/server/modules/cards/*          batch lifecycle and linking
domain integrity-reviewer src/server/modules/prices/*         price versions and activation
domain integrity-reviewer src/server/modules/settings/*       campaign and retention settings
domain integrity-reviewer prisma/*                            constraints and history
domain integrity-reviewer src/app/*                           status words, money display
domain integrity-reviewer src/client/*                        client state
domain security-reviewer src/app/api/*                        endpoint authorization
domain security-reviewer src/server/modules/customers/*       personal data
domain security-reviewer src/server/modules/attendants/*      accounts and assignment
domain security-reviewer src/server/modules/audit/*           audit content

# --- Diff-content signals (added lines only) --------------------------------------------------
signal high   integrity-reviewer  (DROP[[:space:]]+(TABLE|COLUMN|INDEX|CONSTRAINT)|TRUNCATE|DELETE[[:space:]]+FROM|ALTER[[:space:]]+COLUMN.*TYPE|RENAME[[:space:]]+(TO|COLUMN))  destructive SQL
signal medium security-reviewer   (\$queryRaw|\$executeRaw|queryRawUnsafe|executeRawUnsafe)    raw SQL
signal medium integrity-reviewer  (parseFloat|toFixed\(|Math\.round\(|Number\([^)]*(amount|price|rate|kobo|qty|quantity))  float maths near money
signal medium security-reviewer   (dangerouslySetInnerHTML|localStorage\.setItem)            unsafe client storage or HTML
