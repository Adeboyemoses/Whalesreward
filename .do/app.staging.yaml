name: whr-staging
# App Platform uses "fra" for the Frankfurt datacenter "fra1".
region: fra

envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    type: SECRET
    value: ${pg.DATABASE_URL}
  - key: DATABASE_CA_CERT
    scope: RUN_TIME
    value: ${pg.CA_CERT}
  - key: NODE_ENV
    scope: RUN_TIME
    value: production
  - key: TZ
    scope: RUN_TIME
    value: UTC
  - key: NEXT_TELEMETRY_DISABLED
    scope: RUN_TIME
    value: "1"
  - key: BETTER_AUTH_URL
    scope: RUN_TIME
    value: ${APP_URL}
  # Earl enters the secret values in encrypted console fields after app creation.
  - key: BETTER_AUTH_SECRET
    scope: RUN_TIME
    type: SECRET
    value: ""
  - key: STORAGE_ENDPOINT
    scope: RUN_TIME
    value: https://fra1.digitaloceanspaces.com
  - key: STORAGE_REGION
    scope: RUN_TIME
    value: fra1
  - key: STORAGE_BUCKET
    scope: RUN_TIME
    value: whr-staging-evidences
  - key: STORAGE_ACCESS_KEY_ID
    scope: RUN_TIME
    type: SECRET
    value: ""
  - key: STORAGE_SECRET_ACCESS_KEY
    scope: RUN_TIME
    type: SECRET
    value: ""
  # Target do-connecting-ip only after ingress overwrite is confirmed; see runbook.
  - key: WHR_TRUSTED_IP_HEADER
    scope: RUN_TIME
    value: ""
  - key: WHR_SEED_ATTENDANT_PASSWORD
    scope: RUN_TIME
    type: SECRET
    value: ""
  - key: WHR_ENV
    scope: RUN_TIME
    value: staging
  - key: WHR_ENABLE_DEV_GALLERY
    scope: RUN_TIME
    value: "true"

services:
  - name: web
    github:
      repo: Adeboyemoses/Whalesreward
      branch: staging
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 8080
    envs:
      - key: APP_VERSION
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: Adeboyemoses/Whalesreward
      branch: staging
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    run_command: node scripts/deploy/entrypoint.mjs pnpm db:migrate:deploy
  - name: seed
    kind: POST_DEPLOY
    github:
      repo: Adeboyemoses/Whalesreward
      branch: staging
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    run_command: node scripts/deploy/entrypoint.mjs pnpm db:seed

databases:
  - name: pg
    engine: PG
    version: "16"
    production: true
    cluster_name: whr-staging-db
