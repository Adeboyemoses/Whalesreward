# Enforces .review/<branch>.md on every PR into staging (format: .review/README.md).
# Promotion PRs (staging -> main) carry no evidence; Earl's go is recorded in the lane file.
name: review-evidence
on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  review-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate evidence
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1000
          bash scripts/review/required-reviewers.sh "origin/$BASE_REF...$HEAD_SHA"
          bash scripts/review/validate-evidence.sh --base "origin/$BASE_REF" --head "$HEAD_SHA" --branch "$HEAD_REF"
