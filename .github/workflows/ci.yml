# CI for Whales Rewards. Job names are referenced by branch protection: keep them stable.
name: ci
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  TZ: UTC
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  gate-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/review/test-review.sh
      - run: bash .codex/hooks/test-guard.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Keep the major version equal to the DigitalOcean managed cluster's.
        image: postgres:16
        env:
          POSTGRES_USER: whr
          POSTGRES_PASSWORD: whr
          POSTGRES_DB: whr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whr" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://whr:whr@localhost:5432/whr_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy && pnpm test:integration && pnpm test:time

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whr
          POSTGRES_PASSWORD: whr
          POSTGRES_DB: whr_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whr" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://whr:whr@localhost:5432/whr_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate:deploy && pnpm db:seed && pnpm test:e2e
